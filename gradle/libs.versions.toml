[versions]
junit = "5.14.4"
assertj = "3.27.7"
jspecify = "1.0.1"
gson = "2.15.0"
guava = "33.7.2-jre"
errorprone = "2.52.0"
nullaway = "0.14.3"
palantir-java-format = "2.103.0"
jacoco = "0.8.14"
errorprone-plugin = "5.2.0"
nullaway-plugin = "3.3.0"
spotless = "8.11.0"
japicmp = "0.27.0"
japicmp-plugin = "0.4.6"
vanniktech-maven-publish = "0.37.0"
cyclonedx-plugin = "3.6.0"
jmh-plugin = "0.7.4"
jmh = "1.37"
hdrhistogram = "2.2.2"
archunit = "1.5.1"
instancio = "5.5.0"
pmd = "7.29.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
japicmp = { module = "com.github.siom79.japicmp:japicmp", version.ref = "japicmp" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
instancio-core = { module = "org.instancio:instancio-core", version.ref = "instancio" }
instancio-junit = { module = "org.instancio:instancio-junit", version.ref = "instancio" }
pmd-java = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
nullaway = { id = "net.ltgt.nullaway", version.ref = "nullaway-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
japicmp = { id = "me.champeau.gradle.japicmp", version.ref = "japicmp-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx-plugin" }
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }

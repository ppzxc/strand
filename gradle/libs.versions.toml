[versions]
junit = "5.14.4"
assertj = "3.27.7"
jspecify = "1.0.1"
gson = "2.15.0"
errorprone = "2.51.0"
nullaway = "0.14.3"
palantir-java-format = "2.103.0"
jacoco = "0.8.14"
errorprone-plugin = "5.1.1"
nullaway-plugin = "3.3.0"
spotless = "8.10.4"
japicmp = "0.26.5"
japicmp-plugin = "0.4.6"
vanniktech-maven-publish = "0.37.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
japicmp = { module = "com.github.siom79.japicmp:japicmp", version.ref = "japicmp" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
nullaway = { id = "net.ltgt.nullaway", version.ref = "nullaway-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
japicmp = { id = "me.champeau.gradle.japicmp", version.ref = "japicmp-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }

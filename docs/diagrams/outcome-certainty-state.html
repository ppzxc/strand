<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요청 결과 확정성 · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Diagram Design</p>
    <h1>요청 하나의 결과 확정성</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="outcome-certainty-title outcome-certainty-desc">
        <title id="outcome-certainty-title">요청 결과 확정성 상태도</title>
        <desc id="outcome-certainty-desc">내가 보낸 요청이 쓰기 전과 쓰기 시작 뒤를 거쳐 응답 받음, 결과 모름, 처리 안 됨 중 하나로 끝나는 흐름과, 결과별 재전송 가능 여부를 보여 주는 상태도.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Transitions (drawn first) -->
        <line x1="68" y1="200" x2="120" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="200" x2="400" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="560" y1="200" x2="700" y2="200" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 480 160 L 480 88 Q 480 80 488 80 L 700 80" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 480 240 L 480 352 Q 480 360 488 360 L 700 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 200 240 L 200 432 Q 200 440 208 440 L 792 440 Q 800 440 800 432 L 800 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Transition labels -->
        <rect x="78" y="176" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="94" y="188" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">요청</text>

        <rect x="310" y="176" width="60" height="16" rx="2" fill="#f5f5f5"/>
        <text x="340" y="188" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">전송 시작</text>

        <rect x="568" y="176" width="124" height="16" rx="2" fill="#f5f5f5"/>
        <text x="630" y="188" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">취소·기한 초과·끊김</text>

        <rect x="570" y="56" width="60" height="16" rx="2" fill="#f5f5f5"/>
        <text x="600" y="68" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">응답 도착</text>

        <rect x="562" y="336" width="76" height="16" rx="2" fill="#f5f5f5"/>
        <text x="600" y="348" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">거절·CLOSE</text>

        <rect x="432" y="416" width="136" height="16" rx="2" fill="#f5f5f5"/>
        <text x="500" y="428" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">취소·기한 초과·CLOSE</text>

        <!-- Start dot -->
        <circle cx="60" cy="200" r="6" fill="#2d3142"/>

        <!-- State: 쓰기 전 -->
        <rect x="120" y="160" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="120" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="128" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="148" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="200" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">보내기 전</text>
        <text x="200" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">queued · unwritten</text>

        <!-- State: 쓰기 시작 뒤 -->
        <rect x="400" y="160" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="400" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="428" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="480" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">보내기 시작한 뒤</text>
        <text x="480" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">write started · pending</text>

        <!-- Result: 응답 받음 -->
        <rect x="700" y="40" width="200" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="700" y="40" width="200" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="708" y="48" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="730" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>
        <text x="800" y="88" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">응답 받음</text>
        <text x="800" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">retry: not applicable</text>

        <!-- Result: 결과 모름 (focal) -->
        <rect x="700" y="160" width="200" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="700" y="160" width="200" height="80" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="708" y="168" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="730" y="177" fill="#bf4520" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>
        <text x="800" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">결과 모름</text>
        <text x="800" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">retry: idempotency-key</text>

        <!-- Result: 처리 안 됨 -->
        <rect x="700" y="320" width="200" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="700" y="320" width="200" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="708" y="328" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="730" y="337" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>
        <text x="800" y="368" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">처리 안 됨</text>
        <text x="800" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">retry: safe as-is</text>

        <!-- Legend -->
        <line x1="30" y1="476" x2="930" y2="476" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="497" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">범례</text>
        <circle cx="130" cy="493" r="5" fill="#2d3142"/>
        <text x="142" y="497" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">요청 발행</text>
        <rect x="290" y="487" width="16" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="314" y="497" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">진행 중 상태</text>
        <rect x="450" y="487" width="16" height="12" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="474" y="497" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">결과 확정</text>
        <rect x="610" y="487" width="16" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="634" y="497" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">결과 모름</text>
      </svg>
    </div>
  </div>
</body>
</html>

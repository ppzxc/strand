name: CI

# PR 워크플로와 이후 릴리스 워크플로가 이 workflow를 호출한다.
on:
  workflow_call:
  schedule:
    - cron: '30 12 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 호환성 기준선(X.Y.Z 태그)을 계산하려면 태그가 필요하다.
          fetch-depth: 0
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Scan release tree
        if: github.event_name == 'push'
        run: gitleaks dir --redact .
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      # wrapper 검증은 setup-gradle에 내장돼 있다.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew check
      # 테스트가 실패하면 간헐 실패의 이름과 스택을 확보하도록 결과 XML과 HTML 보고서를 남긴다. 성공 시에는 올리지 않는다.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-verify
          path: |
            **/build/test-results/
            **/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
      # .github/scripts의 셸 스크립트 시험. 러너 이미지에 bats가 없을 수 있어 설치한다(release.yml을 파싱하는 시험에 python3-yaml도 쓴다).
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats python3-yaml
      - name: Test CI scripts (bats)
        run: bats .github/scripts/test
      - name: Test SCA severity policy
        run: python3 .github/scripts/test/test_osv_policy.py
      # 배포 테스트 하네스 (a): mavenLocal에 배포한 core를 외부 소비자 4개가 받아 쓰는지 확인한다.
      - name: Deploy test harness (a)
        run: ./gradlew deployTest
      - name: Resolve SCA inputs
        run: |
          ./gradlew --no-configuration-cache --write-locks --write-verification-metadata sha256 -I .github/scripts/osv-locks.init.gradle resolveAllForOsv --console=plain
          for consumer in deploy-test/gradle-classpath deploy-test/gradle-modulepath; do
            ./gradlew -p "$consumer" --no-configuration-cache --write-locks --write-verification-metadata sha256 -I "$GITHUB_WORKSPACE/.github/scripts/osv-locks.init.gradle" -PstrandVersion="$(sed -n 's/^version=//p' gradle.properties)" resolveAllForOsv --console=plain
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends maven
          for consumer in deploy-test/maven-classpath deploy-test/maven-modulepath; do
            mvn -B -DstrandVersion="$(sed -n 's/^version=//p' gradle.properties)" -f "$consumer/pom.xml" org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          done
      - name: Scan resolved dependencies
        run: |
          {
            echo "target_sha=$GITHUB_SHA"
            echo "owner=build"
            echo "gate=SEC-015"
            echo "scanner=OSV-Scanner v2.7.1 sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde"
            echo "command=osv-scanner scan source --recursive --no-ignore --all-packages --format json --verbosity error /src"
          } > "$RUNNER_TEMP/osv-evidence.txt"
          docker pull ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
          scan_status=0
          docker run --rm -v "$GITHUB_WORKSPACE:/src" ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde scan source --recursive --no-ignore --all-packages --format json --verbosity error /src > "$RUNNER_TEMP/osv-report.json" 2> "$RUNNER_TEMP/osv-errors.log" || scan_status=$?
          echo "scanner_exit=$scan_status" >> "$RUNNER_TEMP/osv-evidence.txt"
          if [ "$scan_status" -gt 1 ] || [ -s "$RUNNER_TEMP/osv-errors.log" ]; then
            cat "$RUNNER_TEMP/osv-errors.log"
            exit 1
          fi
          policy_status=0
          python3 .github/scripts/check-osv-policy.py "$RUNNER_TEMP/osv-report.json" || policy_status=$?
          echo "policy_exit=$policy_status" >> "$RUNNER_TEMP/osv-evidence.txt"
          exit "$policy_status"
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scan-report
          path: |
            ${{ runner.temp }}/osv-report.json
            ${{ runner.temp }}/osv-evidence.txt
          if-no-files-found: ignore
          retention-days: 90
      - name: Deploy test harness self-check
        run: deploy-test/self-check.sh "$(sed -n 's/^version=//p' gradle.properties)"

  runtime:
    name: runtime (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Gradle과 컴파일은 JDK 25. 테스트 JVM만 -PtestJavaVersion으로 바뀌고 toolchain이 해당 JDK를 받아 온다.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # 매트릭스 대상 모듈은 루트 build.gradle.kts의 runtimeMatrixTest가 정한다(examples 제외).
      - run: ./gradlew runtimeMatrixTest -PtestJavaVersion=${{ matrix.java }}
      # 테스트가 실패하면 간헐 실패의 이름과 스택을 확보하도록 결과 XML과 HTML 보고서를 남긴다. 성공 시에는 올리지 않는다.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-runtime-jdk-${{ matrix.java }}
          path: |
            **/build/test-results/
            **/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, runtime]
    runs-on: ubuntu-latest
    steps:
      # skipped·cancelled도 통과로 치지 않는다. 모두 success여야 한다.
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if ! echo "$NEEDS" | jq -e '[.[].result] | all(. == "success")' >/dev/null; then
            echo "::error::verify 또는 runtime 매트릭스가 success가 아니다"
            exit 1
          fi

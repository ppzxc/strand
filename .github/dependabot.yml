version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  # 버전 카탈로그(gradle/libs.versions.toml)는 루트와 build-logic이 공유한다.
  # build-logic은 별도 included build라 directories에 둘 다 적는다.
  - package-ecosystem: gradle
    directories:
      - /
      - /build-logic
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns: ['*']
    ignore:
      - dependency-name: 'org.junit:*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'org.assertj:*'
        update-types: ['version-update:semver-major']
